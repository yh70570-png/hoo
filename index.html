var audioCtx = null;
function initAudio() {
try {
if (!audioCtx) {
var AC = window.AudioContext || window.webkitAudioContext;
if (AC) audioCtx = new AC();
}
if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
} catch (e) {}
}

function sfx(type) {
if (!audioCtx) return;
try {
var now = audioCtx.currentTime;
var osc = audioCtx.createOscillator();
var g = audioCtx.createGain();
osc.connect(g); g.connect(audioCtx.destination);
if (type === 'shot') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, now);
osc.frequency.exponentialRampToValueAtTime(42, now + 0.08);
g.gain.setValueAtTime(0.15, now);
g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
osc.start(now); osc.stop(now + 0.09);
} else if (type === 'rail') {
osc.type = 'square';
osc.frequency.setValueAtTime(620, now);
osc.frequency.exponentialRampToValueAtTime(80, now + 0.17);
g.gain.setValueAtTime(0.18, now);
g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
osc.start(now); osc.stop(now + 0.18);
} else if (type === 'boom') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(100, now);
osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
g.gain.setValueAtTime(0.3, now);
g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
osc.start(now); osc.stop(now + 0.42);
}
} catch (e) {}
}

 ];

}
arr.sort(function(a, b) { return b.time - a.time || b.kills - a.kills; });
return arr.slice(0, 8);
}

var arr = getLb();

try { localStorage.setItem(LB_KEY, JSON.stringify(arr.slice(0, 10))); } catch (e) {}
renderLb();
}

joyPad.style.left = (tSX - 52) + 'px';
joyPad.style.top = (tSY - 52) + 'px';
joyStick.style.transform = 'translate(0px,0px)';
}, { passive: false });

window.addEventListener('touchmove', function(e) {
if (!tActive || state !== 'PLAY') return;
e.preventDefault();
var t = e.touches[0];
var dx = t.clientX - tSX, dy = t.clientY - tSY;
var d = Math.sqrt(dx * dx + dy * dy);
var maxR = 42;
if (d > 0) {
var cl = Math.min(d, maxR);
jX = (dx / d) * (cl / maxR);
jY = (dy / d) * (cl / maxR);
joyStick.style.transform = 'translate(' + (jX * maxR) + 'px,' + (jY * maxR) + 'px)';
}
}, { passive: false });

window.addEventListener('touchend', function() {
tActive = false; jX = 0; jY = 0;
joyPad.style.display = 'none';
});

function startGame() {
initAudio();
var v = document.getElementById('nameInp').value.trim();
agentName = v || 'GHOST-01';
document.getElementById('hudName').textContent = agentName;

player.x = 0; player.y = 0; player.hp = 100; player.maxHp = 100; player.speed = 220;
player.lv = 1; player.xp = 0; player.nextXp = 10;
player.dmgMult = 1; player.cdMult = 1; player.magRange = 120;
for (var k in player.skills) player.skills[k] = 0;
player.skills.shotgun = 1;
player.timers = { shotgun: 0, emp: 0, railgun: 0, orbital: 0 };

elapsed = 0; kills = 0; shake = 0; rivalBeaten = false;
enemies = []; bullets = []; gems = []; particles = []; decals = []; shells = [];

document.getElementById('startModal').style.display = 'none';
document.getElementById('overModal').style.display = 'none';
document.getElementById('lvModal').style.display = 'none';
document.getElementById('hud').style.display = 'block';

if (rivalName && rivalTime > 0) {
document.getElementById('rivalHud').style.display = 'block';
}
updateHud();
state = 'PLAY';
}

function updateHud() {
document.getElementById('hudLv').textContent = player.lv;
document.getElementById('hudHp').textContent = Math.ceil(player.hp) + '/' + player.maxHp;
document.getElementById('hudKills').textContent = kills;
document.getElementById('xpBar').style.width = Math.min(100, (player.xp / player.nextXp) * 100) + '%';
document.getElementById('timerTxt').textContent = fmtTime(elapsed);
document.getElementById('hudWave').textContent = 'STAGE ' + (1 + Math.floor(elapsed / 35));

if (rivalName && rivalTime > 0) {
var rem = rivalTime - Math.floor(elapsed);
var rh = document.getElementById('rivalHud');
if (rem > 0) {
rh.style.color = '#f59e0b';
rh.textContent = 'TARGET [' + rivalName + '] -' + fmtTime(rem);
} else {
rh.style.color = '#10b981';
rh.textContent = 'TARGET [' + rivalName + '] BEATEN!';
if (!rivalBeaten) {
rivalBeaten = true;
toast(rivalName + ' RECORD BEATEN!');
}
}
}
}

function spawnEnemy() {
var a = Math.random() * Math.PI * 2;
var dist = Math.max(W, H) * 0.6 + 70;
var ex = player.x + Math.cos(a) * dist;
var ey = player.y + Math.sin(a) * dist;
var sc = 1 + elapsed / 45;
var roll = Math.random();
var r = 13, hp = 24 * sc, spd = 84 + Math.random() * 24, col = '#4b5563', xp = 3;
if (elapsed > 20 && roll < 0.24) {
r = 10; hp = 15 * sc; spd = 152; col = '#991b1b'; xp = 4;
} else if (elapsed > 45 && roll > 0.85) {
r = 23; hp = 115 * sc; spd = 56; col = '#3f6212'; xp = 14;
}
enemies.push({ x: ex, y: ey, r: r, hp: hp, maxHp: hp, speed: spd, col: col, xp: xp, flash: 0 });
}

function closestEnemy(maxD) {
var best = null, bd = maxD;
for (var i = 0; i < enemies.length; i++) {
var e = enemies[i];
var d = Math.hypot(e.x - player.x, e.y - player.y);
if (d < bd) { bd = d; best = e; }
}
return best;
}

function hitEnemy(e, dmg, knock) {
e.hp -= dmg;
e.flash = 0.08;
var a = Math.atan2(e.y - player.y, e.x - player.x);
e.x += Math.cos(a) * (knock || 6);
e.y += Math.sin(a) * (knock || 6);
if (e.hp <= 0) {
kills++;
gems.push({ x: e.x, y: e.y, val: e.xp });
if (decals.length > 80) decals.shift();
decals.push({ x: e.x, y: e.y, r: e.r * (0.9 + Math.random() * 0.5), blood: true });
for (var i = 0; i < 5; i++) {
var pa = Math.random() * Math.PI * 2;
var ps = 40 + Math.random() * 100;
particles.push({ x: e.x, y: e.y, vx: Math.cos(pa) * ps, vy: Math.sin(pa) * ps, r: 2.5, col: '#dc2626', life: 0.3, max: 0.3 });
}
}
}

function openLevelUp() {
state = 'LEVELUP';
var keys = Object.keys(SKILLS);
keys.sort(function() { return Math.random() - 0.5; });
var pick = keys.slice(0, 3);
var box = document.getElementById('skillList');
box.innerHTML = '';
pick.forEach(function(k) {
var s = SKILLS[k];
var lv = player.skills[k];
var div = document.createElement('div');
div.className = 'skill-item';
div.innerHTML =
'<div class="skill-badge">' + s.code + '</div>' +
'<div style="flex:1;">' +
'<div style="display:flex; justify-content:space-between; margin-bottom:4px;">' +
'<strong style="color:#fff; font-size:14px;">' + s.name + '</strong>' +
'<span style="color:#f59e0b; font-size:11px; font-weight:800;">' + (lv === 0 ? 'NEW' : 'LV.' + lv + ' -> LV.' + (lv + 1)) + '</span>' +
'</div>' +
'<div style="color:#94a3b8; font-size:12px;">' + s.desc + '</div>' +
'</div>';
div.onclick = function() {
player.skills[k]++;
if (k === 'dmgUp') player.dmgMult += 0.25;
if (k === 'haste') player.cdMult *= 0.85;
if (k === 'boots') player.speed *= 1.15;
if (k === 'magnet') {
player.magRange *= 1.45;
player.maxHp += 30;
player.hp = Math.min(player.maxHp, player.hp + 30);
}
document.getElementById('lvModal').style.display = 'none';
state = 'PLAY';
updateHud();
};
box.appendChild(div);
});
document.getElementById('lvModal').style.display = 'flex';
}

function update(dt) {
if (state !== 'PLAY') return;
elapsed += dt;
if (shake > 0) shake = Math.max(0, shake - dt * 25);

var mx = 0, my = 0;
if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
if (keys['KeyS'] || keys['ArrowDown']) my += 1;
if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

if (tActive) {
mx = jX; my = jY;
} else if (mx !== 0 || my !== 0) {
var l = Math.hypot(mx, my);
mx /= l; my /= l;
}

player.x += mx * player.speed * dt;
player.y += my * player.speed * dt;

var tgt = closestEnemy(650);
if (tgt) {
player.angle = Math.atan2(tgt.y - player.y, tgt.x - player.x);
} else if (mx !== 0 || my !== 0) {
player.angle = Math.atan2(my, mx);
}

// 1. 산탄총
player.timers.shotgun -= dt;
if (player.timers.shotgun <= 0) {
var lv = player.skills.shotgun;
player.timers.shotgun = Math.max(0.26, (0.92 - lv * 0.06) * player.cdMult);
var cnt = 3 + lv;
var sp = 0.35;
for (var i = 0; i < cnt; i++) {
var a = player.angle + (i - (cnt - 1) / 2) * (sp / cnt);
bullets.push({
x: player.x + Math.cos(player.angle) * 16,
y: player.y + Math.sin(player.angle) * 16,
vx: Math.cos(a) * 700, vy: Math.sin(a) * 700,
dmg: (19 + lv * 6) * player.dmgMult,
pierce: 1 + Math.floor(lv / 2),
life: 0.75, col: '#fbbf24', r: 3.2
});
}
// 탄피 배출
if (shells.length > 60) shells.shift();
var sa = player.angle + Math.PI / 2 + (Math.random() - 0.5) * 0.4;
shells.push({ x: player.x + Math.cos(sa) * 12, y: player.y + Math.sin(sa) * 12 });
particles.push({ x: player.x + Math.cos(player.angle) * 20, y: player.y + Math.sin(player.angle) * 20, vx: 0, vy: 0, r: 9, col: '#fef08a', life: 0.05, max: 0.05 });
sfx('shot');
}

// 2. 회전 드론
if (player.skills.blades > 0) {
var blv = player.skills.blades;
var bcnt = 1 + blv;
var br = 78 + blv * 6;
var rot = elapsed * (3.8 + blv * 0.4);
for (var bi = 0; bi < bcnt; bi++) {
var ba = rot + (bi * Math.PI * 2) / bcnt;
var bx = player.x + Math.cos(ba) * br;
var by = player.y + Math.sin(ba) * br;
for (var ei = 0; ei < enemies.length; ei++) {
var e = enemies[ei];
if (Math.hypot(e.x - bx, e.y - by) < e.r + 14) {
hitEnemy(e, (48 + blv * 15) * player.dmgMult * dt * 4, 2);
}
}
}
}

// 3. EMP 방전
if (player.skills.emp > 0) {
player.timers.emp -= dt;
if (player.timers.emp <= 0) {
var elv = player.skills.emp;
player.timers.emp = Math.max(1.1, (3.1 - elv * 0.2) * player.cdMult);
var erad = 125 + elv * 22;
particles.push({ x: player.x, y: player.y, vx: 0, vy: 0, r: erad, col: '#38bdf8', life: 0.22, max: 0.22, ring: true });
for (var ei2 = 0; ei2 < enemies.length; ei2++) {
var e2 = enemies[ei2];
if (Math.hypot(e2.x - player.x, e2.y - player.y) <= erad) {
hitEnemy(e2, (28 + elv * 12) * player.dmgMult, 16);
}
}
}
}

// 4. 레일건
if (player.skills.railgun > 0) {
player.timers.railgun -= dt;
if (player.timers.railgun <= 0 && enemies.length > 0) {
var rlv = player.skills.railgun;
player.timers.railgun = Math.max(1.0, (2.7 - rlv * 0.22) * player.cdMult);
var topE = enemies[0];
for (var ri = 1; ri < enemies.length; ri++) if (enemies[ri].hp > topE.hp) topE = enemies[ri];
var ra = Math.atan2(topE.y - player.y, topE.x - player.x);
bullets.push({
x: player.x, y: player.y,
vx: Math.cos(ra) * 1150, vy: Math.sin(ra) * 1150,
dmg: (68 + rlv * 30) * player.dmgMult,
pierce: 99, life: 0.9, col: '#22d3ee', r: 5.5
});
sfx('rail');
}
}

// 5. 궤도 폭격
if (player.skills.orbital > 0) {
player.timers.orbital -= dt;
if (player.timers.orbital <= 0 && enemies.length > 0) {
var olv = player.skills.orbital;
player.timers.orbital = Math.max(1.6, (4.3 - olv * 0.35) * player.cdMult);
var pickE = enemies[Math.floor(Math.random() * enemies.length)];
var orad = 115 + olv * 18;
shake = 9;
sfx('boom');
if (decals.length > 80) decals.shift();
decals.push({ x: pickE.x, y: pickE.y, r: orad * 0.7, blood: false });
particles.push({ x: pickE.x, y: pickE.y, vx: 0, vy: 0, r: orad, col: '#f97316', life: 0.35, max: 0.35, ring: true });
for (var oi = 0; oi < enemies.length; oi++) {
var oe = enemies[oi];
if (Math.hypot(oe.x - pickE.x, oe.y - pickE.y) <= orad) {
hitEnemy(oe, (95 + olv * 40) * player.dmgMult, 24);
}
}
}
}

// 탄환 처리
for (var i = bullets.length - 1; i >= 0; i--) {
var b = bullets[i];
b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
if (b.life <= 0) { bullets.splice(i, 1); continue; }
for (var j = enemies.length - 1; j >= 0; j--) {
var e = enemies[j];
if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
hitEnemy(e, b.dmg, 7);
b.pierce--;
if (b.pierce <= 0) { bullets.splice(i, 1); break; }
}
}
}

enemies = enemies.filter(function(e) { return e.hp > 0; });

spawnT -= dt;
if (spawnT <= 0) {
spawnT = Math.max(0.08, 0.65 - elapsed * 0.0035);
var batch = 1 + Math.floor(elapsed / 38);
for (var si = 0; si < batch; si++) if (enemies.length < 220) spawnEnemy();
}

for (var ei3 = 0; ei3 < enemies.length; ei3++) {
var en = enemies[ei3];
if (en.flash > 0) en.flash -= dt;
var ea = Math.atan2(player.y - en.y, player.x - en.x);
en.x += Math.cos(ea) * en.speed * dt;
en.y += Math.sin(ea) * en.speed * dt;
if (Math.hypot(player.x - en.x, player.y - en.y) < player.r + en.r) {
player.hp -= (18 + elapsed * 0.12) * dt;
shake = 4;
if (player.hp <= 0) {
player.hp = 0;
gameOver();
return;
}
}
}

for (var gi = gems.length - 1; gi >= 0; gi--) {
var g = gems[gi];
var gd = Math.hypot(player.x - g.x, player.y - g.y);
if (gd < player.magRange) {
var ga = Math.atan2(player.y - g.y, player.x - g.x);
g.x += Math.cos(ga) * 480 * dt;
g.y += Math.sin(ga) * 480 * dt;
}
if (gd < player.r + 10) {
player.xp += g.val;
gems.splice(gi, 1);
if (player.xp >= player.nextXp) {
player.xp -= player.nextXp;
player.lv++;
player.nextXp = Math.floor(player.nextXp * 1.32 + 8);
openLevelUp();
return;
}
}
}

for (var pi = particles.length - 1; pi >= 0; pi--) {
var p = particles[pi];
p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
if (p.life <= 0) particles.splice(pi, 1);
}

updateHud();
}

function draw() {
ctx.fillStyle = '#0a0d12';
ctx.fillRect(0, 0, W, H);

ctx.save();
var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
var camX = W / 2 - player.x + sx;
var camY = H / 2 - player.y + sy;
ctx.translate(camX, camY);

// 전술 그리드 바닥 (createPattern 없이 100% 호환되는 직접 드로잉)
var step = 90;
var startX = Math.floor((player.x - W) / step) * step;
var endX = player.x + W;
var startY = Math.floor((player.y - H) / step) * step;
var endY = player.y + H;
ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
ctx.lineWidth = 1;
ctx.beginPath();
for (var gx = startX; gx <= endX; gx += step) {
ctx.moveTo(gx, startY); ctx.lineTo(gx, endY);
}
for (var gy = startY; gy <= endY; gy += step) {
ctx.moveTo(startX, gy); ctx.lineTo(endX, gy);
}
ctx.stroke();

// 혈흔 및 크레이터 데칼
for (var di = 0; di < decals.length; di++) {
var d = decals[di];
ctx.fillStyle = d.blood ? 'rgba(85, 12, 12, 0.55)' : 'rgba(5, 6, 8, 0.75)';
ctx.beginPath();
ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
ctx.fill();
}

// 탄피
ctx.fillStyle = '#d97706';
for (var si = 0; si < shells.length; si++) {
ctx.fillRect(shells[si].x, shells[si].y, 4, 2);
}

// 전술 손전등 조명 효과 (Cone Light)
ctx.save();
ctx.translate(player.x, player.y);
ctx.rotate(player.angle);
var coneGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 340);
coneGrad.addColorStop(0, 'rgba(254, 243, 199, 0.16)');
coneGrad.addColorStop(1, 'rgba(254, 243, 199, 0)');
ctx.fillStyle = coneGrad;
ctx.beginPath();
ctx.moveTo(0, 0);
ctx.arc(0, 0, 340, -0.45, 0.45);
ctx.closePath();
ctx.fill();
ctx.restore();

// 코어 젬
ctx.fillStyle = '#38bdf8';
for (var gi = 0; gi < gems.length; gi++) {
ctx.beginPath();
ctx.arc(gems[gi].x, gems[gi].y, 4.2, 0, Math.PI * 2);
ctx.fill();
}

// 회전 칼날
if (player.skills.blades > 0) {
var blv = player.skills.blades;
var bcnt = 1 + blv;
var br = 78 + blv * 6;
var rot = elapsed * (3.8 + blv * 0.4);
for (var bi = 0; bi < bcnt; bi++) {
var ba = rot + (bi * Math.PI * 2) / bcnt;
var bx = player.x + Math.cos(ba) * br;
var by = player.y + Math.sin(ba) * br;
ctx.fillStyle = '#e2e8f0';
ctx.beginPath();
ctx.arc(bx, by, 10, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#f59e0b';
ctx.lineWidth = 2;
ctx.stroke();
}
}

// 감염체
for (var ei = 0; ei < enemies.length; ei++) {
var e = enemies[ei];
ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.col;
ctx.beginPath();
ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#06080b';
ctx.lineWidth = 2;
ctx.stroke();

var ea = Math.atan2(player.y - e.y, player.x - e.x);
ctx.fillStyle = '#ef4444';
ctx.beginPath();
ctx.arc(e.x + Math.cos(ea - 0.3) * (e.r * 0.55), e.y + Math.sin(ea - 0.3) * (e.r * 0.55), 2, 0, Math.PI * 2);
ctx.arc(e.x + Math.cos(ea + 0.3) * (e.r * 0.55), e.y + Math.sin(ea + 0.3) * (e.r * 0.55), 2, 0, Math.PI * 2);
ctx.fill();
}

// 요원 캐릭터
ctx.save();
ctx.translate(player.x, player.y);
ctx.rotate(player.angle);
ctx.strokeStyle = 'rgba(239, 68, 68, 0.38)';
ctx.lineWidth = 1.2;
ctx.beginPath();
ctx.moveTo(14, 0); ctx.lineTo(250, 0);
ctx.stroke();

ctx.fillStyle = '#64748b';
ctx.fillRect(8, -3, 16, 6);

ctx.fillStyle = '#1e293b';
ctx.beginPath();
ctx.arc(0, 0, player.r, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#f59e0b';
ctx.lineWidth = 2.5;
ctx.stroke();

ctx.fillStyle = '#10b981';
ctx.fillRect(6, -5, 6, 10);
ctx.restore();

// 체력바
ctx.fillStyle = 'rgba(0,0,0,0.8)';
ctx.fillRect(player.x - 18, player.y + 22, 36, 5);
ctx.fillStyle = player.hp > 35 ? '#10b981' : '#ef4444';
ctx.fillRect(player.x - 18, player.y + 22, 36 * (player.hp / player.maxHp), 5);

// 탄환 & 파티클
for (var bi2 = 0; bi2 < bullets.length; bi2++) {
var b = bullets[bi2];
ctx.fillStyle = b.col;
ctx.beginPath();
ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
ctx.fill();
}
for (var pi = 0; pi < particles.length; pi++) {
var p = particles[pi];
ctx.save();
ctx.globalAlpha = Math.max(0, p.life / p.max);
if (p.ring) {
ctx.strokeStyle = p.col;
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(p.x, p.y, p.r * (1 - p.life / p.max * 0.35), 0, Math.PI * 2);
ctx.stroke();
} else {
ctx.fillStyle = p.col;
ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fill();
}
ctx.restore();
}

ctx.restore();

// 외곽 암흑 비네팅
var vig = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, Math.max(W, H) * 0.65);
vig.addColorStop(0, 'rgba(0,0,0,0)');
vig.addColorStop(1, 'rgba(3,4,7,0.85)');
ctx.fillStyle = vig;
ctx.fillRect(0, 0, W, H);
}

saveLb(agentName, sec, kills);
document.getElementById('resTime').textContent = fmtTime(sec);
document.getElementById('resKills').textContent = kills;
document.getElementById('resLv').textContent = player.lv;
document.getElementById('overModal').style.display = 'flex';
}

 ];
